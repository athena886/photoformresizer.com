<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found – Photo Form Resizer</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      place-items: center;
      background: #f3f7f4;
      color: #17211b;
    }

    main {
      width: min(100%, 520px);
      padding: 28px;
      border: 1px solid #d9e1dc;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(29, 50, 38, 0.09);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 8vw, 2.6rem);
    }

    p {
      margin: 0 0 20px;
      color: #5d6a62;
    }

    a {
      display: inline-flex;
      min-height: 48px;
      padding: 10px 16px;
      align-items: center;
      border-radius: 10px;
      background: #17211b;
      color: #fff;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The page you requested does not exist.</p>
    <a href="/">Return to homepage</a>
  </main>
</body>
</html>
